[project]
name = "pdagent"
version = "0.1.0"
description = "PropertyDek AI Assistant backend service (Phase 0 Scaffolding & Discovery)"
readme = "docs/PRD.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]~=0.162.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.9,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "procrastinate>=3.0,<4",
    "redis>=5.2,<8",
    "mcp>=2.0,<3",
    "anthropic>=1.0,<2",
    "openai>=3.0,<4",
    "google-genai>=2.0,<3",
    "pypdf>=6.21.4,<7",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp>=1.28,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17.0",
    "mypy>=1.13,<2",
    "pytest>=9.0,<9.2",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<8",
    "testcontainers[postgres]>=4.8,<5",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdagent"]

[tool.uv]
exclude-newer = "2026-10-18T00:00:00Z"
exclude-newer-package = { fastapi = "2026-11-01T00:00:00Z", certifi = "2026-11-01T00:00:00Z", pypdf = "2026-11-01T00:00:00Z", pyasn1 = "2026-11-01T00:00:00Z", pyasn1-modules = "2026-11-01T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "pdagent.auth.deps.require_roles",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["pdagent"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "procrastinate.*",
    "testcontainers.*",
    "opentelemetry.*",
    "docx.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=src/pdagent --cov-report=term-missing"

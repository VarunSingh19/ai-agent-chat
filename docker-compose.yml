services:
  db:
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: pdagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:8.0-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
